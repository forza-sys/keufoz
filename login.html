<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Dashboard Keuangan FOZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --green: #10b981;
      --green-dark: #059669;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --red: #ef4444;
    }
    
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: var(--text-main);
    }
    
    .login-container {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    
    .logo-icon {
      font-size: 3rem;
      color: var(--green);
      margin-bottom: 16px;
    }
    
    h1 {
      font-size: 1.5rem;
      margin: 0 0 8px 0;
    }
    
    p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin: 0 0 24px 0;
    }
    
    .input-group {
      position: relative;
      margin-bottom: 20px;
    }
    
    .input-group input {
      width: 100%;
      padding: 14px 16px;
      padding-left: 44px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
    }
    
    .input-group input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }
    
    .input-group i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }
    
    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .btn-login:hover {
      background: var(--green-dark);
    }
    
    .error-msg {
      color: var(--red);
      font-size: 0.85rem;
      margin-top: 12px;
      display: none;
      background: rgba(239, 68, 68, 0.1);
      padding: 10px;
      border-radius: 8px;
    }
    
    .show-error {
      display: block;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo-icon">
      <i class="fas fa-shield-alt"></i>
    </div>
    <h1>Dashboard Keuangan FOZ</h1>
    <p>Silakan masukkan kata sandi untuk mengakses dashboard.</p>
    
    <form id="login-form">
      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Kata Sandi" required autocomplete="current-password">
      </div>
      
      <button type="submit" class="btn-login">Masuk Dashboard</button>
      
      <div class="error-msg" id="error-msg">
        <i class="fas fa-exclamation-circle"></i> Kata sandi salah. Silakan coba lagi.
      </div>
    </form>
  </div>

  <script>
    // HARDCODED PASSWORD (TIDAK UNTUK SISTEM KEAMANAN TINGGI)
    const CORRECT_PASS = 'keuanganfoz';
    
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const pwd = document.getElementById('password').value;
      
      if (pwd === CORRECT_PASS) {
        // Set session
        sessionStorage.setItem('foz_auth', 'true');
        // Redirect
        window.location.href = 'kas-komprehensif.html';
      } else {
        const errMsg = document.getElementById('error-msg');
        errMsg.classList.add('show-error');
        
        // shake effect
        const container = document.querySelector('.login-container');
        container.style.transform = 'translateX(-5px)';
        setTimeout(() => container.style.transform = 'translateX(5px)', 100);
        setTimeout(() => container.style.transform = 'translateX(-5px)', 200);
        setTimeout(() => container.style.transform = 'translateX(5px)', 300);
        setTimeout(() => container.style.transform = 'translateX(0)', 400);
      }
    });
    
    // Redirect auto if already logged in
    if (sessionStorage.getItem('foz_auth') === 'true') {
      window.location.href = 'kas-komprehensif.html';
    }
  </script>
</body>
</html>
