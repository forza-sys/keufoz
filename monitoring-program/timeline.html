<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline Event Besar — HAZANA FOZ</title>
  <link rel="stylesheet" href="../dashboard-keuangan-app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    /* 16:9 Aspect Ratio / Single Page Layout Constraints */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg-color, #f9fafb);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    .timeline-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-height: 100vh;
      box-sizing: border-box;
    }

    .timeline-header {
      padding: 16px 24px;
      background: var(--card-bg, #ffffff);
      border-bottom: 1.5px solid var(--border-color, #e5e7eb);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .timeline-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding: 16px 24px;
      overflow: hidden;
      min-height: 0; /* Prevents overflow pushing body height */
    }

    .year-column {
      background: var(--card-bg, #ffffff);
      border: 1.5px solid var(--border-color, #e5e7eb);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.03);
    }

    .year-header {
      padding: 12px 16px;
      background: linear-gradient(135deg, rgba(16,185,129,0.08) 0%, rgba(5,150,105,0.04) 100%);
      border-bottom: 1.5px solid var(--border-color, #e5e7eb);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .year-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #10b981;
      letter-spacing: 0.5px;
    }

    .year-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
    }

    .event-card {
      background: var(--card-bg, #ffffff);
      border: 1.5px solid var(--border-color, #f3f4f6);
      border-left: 4px solid #10b981;
      border-radius: 10px;
      padding: 10px 12px;
      transition: all 0.2s ease;
      position: relative;
    }
    .event-card:hover {
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
      border-color: #10b981;
    }
    .event-card.akan-datang {
      border-left-color: #3b82f6;
    }

    .event-date {
      font-size: 0.72rem;
      font-weight: 700;
      color: #6b7280;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .event-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--heading-color, #111827);
      margin: 0 0 4px 0;
      line-height: 1.3;
    }

    .event-status-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .badge-terlaksana { background: rgba(16,185,129,0.12); color: #059669; }
    .badge-akan { background: rgba(59,130,246,0.12); color: #2563eb; }

    /* Media query for smaller screens */
    @media (max-width: 1024px) {
      html, body { overflow: auto; }
      .timeline-container { height: auto; max-height: none; }
      .timeline-grid { grid-template-columns: repeat(2, 1fr); overflow: visible; }
    }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>

  <main class="main-content" style="padding: 0; height: 100vh; overflow: hidden;">
    <div class="timeline-container">
      <!-- Header Bar -->
      <div class="timeline-header">
        <div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <h1 style="font-size: 1.35rem; font-weight: 800; color: var(--heading-color, #111827); margin: 0;">Roadmap Timeline Event FOZ</h1>
            <span style="font-size: 0.72rem; font-weight: 700; background: #10b981; color: #fff; padding: 2px 8px; border-radius: 10px;">16:9 VIEW</span>
          </div>
          <p style="font-size: 0.82rem; color: #6b7280; margin-top: 2px; margin-bottom: 0;">Jadwal Pelaksanaan Event Besar Forum Zakat Periode 2024 - 2027</p>
        </div>

        <div style="display: flex; align-items: center; gap: 16px;">
          <!-- Quick Stats -->
          <div style="display: flex; gap: 12px; font-size: 0.8rem; font-weight: 600;">
            <div style="background: rgba(16,185,129,0.1); color: #059669; padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(16,185,129,0.2);">
              ✅ Terlaksana: <span id="stat-terlaksana-count">0</span>
            </div>
            <div style="background: rgba(59,130,246,0.1); color: #2563eb; padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(59,130,246,0.2);">
              ⏳ Akan Datang: <span id="stat-akan-count">0</span>
            </div>
          </div>

          <a href="program.html" style="display: inline-flex; align-items: center; gap: 6px; background: var(--card-bg, #fff); color: var(--text-color, #374151); border: 1.5px solid var(--border-color, #e5e7eb); padding: 7px 14px; border-radius: 8px; font-size: 0.82rem; font-weight: 600; text-decoration: none; transition: all 0.2s;">
            <i class="ph-light ph-kanban"></i> Ke Program Kerja
          </a>
        </div>
      </div>

      <!-- Timeline 4 Column Grid (2024, 2025, 2026, 2027) -->
      <div class="timeline-grid">
        <!-- 2024 -->
        <div class="year-column">
          <div class="year-header">
            <span class="year-title">📅 2024</span>
            <span id="badge-2024" style="font-size: 0.72rem; font-weight: 700; color: #6b7280; background: rgba(0,0,0,0.05); padding: 2px 8px; border-radius: 8px;">0 Event</span>
          </div>
          <div class="year-body" id="events-2024">
            <div style="text-align: center; color: #9ca3af; padding: 20px;"><i class="ph-light ph-spinner spinner-rotate"></i></div>
          </div>
        </div>

        <!-- 2025 -->
        <div class="year-column">
          <div class="year-header">
            <span class="year-title">📅 2025</span>
            <span id="badge-2025" style="font-size: 0.72rem; font-weight: 700; color: #6b7280; background: rgba(0,0,0,0.05); padding: 2px 8px; border-radius: 8px;">0 Event</span>
          </div>
          <div class="year-body" id="events-2025">
            <div style="text-align: center; color: #9ca3af; padding: 20px;"><i class="ph-light ph-spinner spinner-rotate"></i></div>
          </div>
        </div>

        <!-- 2026 -->
        <div class="year-column">
          <div class="year-header">
            <span class="year-title">📅 2026</span>
            <span id="badge-2026" style="font-size: 0.72rem; font-weight: 700; color: #6b7280; background: rgba(0,0,0,0.05); padding: 2px 8px; border-radius: 8px;">0 Event</span>
          </div>
          <div class="year-body" id="events-2026">
            <div style="text-align: center; color: #9ca3af; padding: 20px;"><i class="ph-light ph-spinner spinner-rotate"></i></div>
          </div>
        </div>

        <!-- 2027 -->
        <div class="year-column">
          <div class="year-header">
            <span class="year-title">📅 2027</span>
            <span id="badge-2027" style="font-size: 0.72rem; font-weight: 700; color: #6b7280; background: rgba(0,0,0,0.05); padding: 2px 8px; border-radius: 8px;">0 Event</span>
          </div>
          <div class="year-body" id="events-2027">
            <div style="text-align: center; color: #9ca3af; padding: 20px;"><i class="ph-light ph-spinner spinner-rotate"></i></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="../sidebar.js"></script>
  <script src="./timeline.js"></script>
</body>
</html>
